apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      containers:
      - name: banking-container
        image: DOCKERHUB_TAG_PLACEHOLDER
        ports:
        - containerPort: 80