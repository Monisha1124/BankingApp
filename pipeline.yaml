name: CI/CD Banking Pipeline

on:
  push:
    branches: [ main ]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Automated Tests (CI)
      run: python -m unittest test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Generate Unique Version Tag
      id: versioning
      run: |
        if grep -q "def withdraw" app.py; then
          echo "TAG=v2" >> $GITHUB_ENV
        else
          echo "TAG=v1" >> $GITHUB_ENV
        fi

    -  name: Build and Push (Build)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bankingapp:${{ env.TAG }}

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Inject Target Image Version into Manifest
      run: |
        sed -i "s|DOCKERHUB_TAG_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ env.TAG }}|g" k8s/deployment.yaml

    - name: Deploy to Kubernetes Cluster (Deployment)
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml